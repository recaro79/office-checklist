<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>사무실 업무 체크리스트</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; background: #f0f4f8; color: #1a202c; font-size: 14px; }

/* ── Setup ── */
#setup-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.setup-card { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
.setup-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #2d3748; }
.setup-card p { font-size: 14px; color: #718096; margin-bottom: 28px; line-height: 1.6; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; transition: border-color .2s; font-family: inherit; }
.form-group input:focus { outline: none; border-color: #5a67d8; }
.btn-connect { width: 100%; padding: 14px; background: #5a67d8; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-connect:hover { background: #4c51bf; }
.setup-hint { margin-top: 14px; font-size: 12px; color: #a0aec0; text-align: center; }

/* ── App ── */
#main-app { display: none; min-height: 100vh; }
.header { background: white; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.header h1 { font-size: 16px; font-weight: 700; color: #2d3748; }
.header .date { font-size: 10px; color: #a0aec0; margin-top: 2px; }
.sync-area { display: flex; align-items: center; gap: 6px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; }
.sync-dot.ok { background: #48bb78; }
.sync-dot.err { background: #fc8181; }
.sync-dot.loading { background: #f6ad55; animation: blink .9s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.sync-txt { font-size: 10px; color: #718096; }
.btn-reset { padding: 4px 10px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 5px; font-size: 11px; color: #718096; cursor: pointer; }

.tabs { display: flex; overflow-x: auto; background: white; border-bottom: 1px solid #e2e8f0; padding: 0 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 10px 13px; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; color: #718096; }
.tab.active { color: #5a67d8; border-bottom-color: #5a67d8; font-weight: 700; }

.content { padding: 12px; max-width: 720px; margin: 0 auto; }
.summary-bar { background: white; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; display: flex; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.summary-item { text-align: center; flex: 1; }
.summary-item .num { font-size: 20px; font-weight: 700; color: #5a67d8; }
.summary-item .lbl { font-size: 10px; color: #a0aec0; margin-top: 2px; }
.summary-item.sdone .num { color: #48bb78; }
.summary-item.scomp .num { color: #805ad5; }
.summary-item.smid  .num { color: #f6ad55; }

.client-card { background: white; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); overflow: hidden; }
.client-card.comp-card { border-left: 3px solid #805ad5; opacity: .88; }
.client-header { padding: 11px 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.client-header:hover { background: #f7fafc; }
.client-name { font-size: 13px; font-weight: 600; color: #2d3748; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp-card .client-name { color: #6b7280; }
.progress-info { text-align: right; flex-shrink: 0; }
.progress-text { font-size: 10px; color: #a0aec0; margin-bottom: 2px; }
.progress-bar { width: 60px; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: #5a67d8; border-radius: 2px; transition: width .3s; }
.progress-fill.pf-done { background: #48bb78; }
.progress-fill.pf-comp { background: #805ad5; }
.btn-complete { padding: 4px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; border: 1.5px solid #805ad5; color: #805ad5; background: white; transition: all .15s; }
.btn-complete:hover { background: #805ad5; color: white; }
.btn-complete.is-done { background: #805ad5; color: white; }
.btn-complete.is-done:hover { background: #6b46c1; border-color: #6b46c1; }
.chevron { font-size: 9px; color: #cbd5e0; transition: transform .2s; flex-shrink: 0; }
.chevron.open { transform: rotate(180deg); }

.client-body { display: none; padding: 0 13px 12px; }
.client-body.open { display: block; }
.body-divider { height: 1px; background: #f0f4f8; margin-bottom: 4px; }

.header-memo { flex: 1; min-width: 60px; max-width: 150px; padding: 4px 9px; border: 1px solid #e2e8f0; border-radius: 20px; font-size: 11px; color: #718096; background: #f7fafc; outline: none; font-family: inherit; }
.header-memo:focus { border-color: #5a67d8; background: white; }
.header-memo::placeholder { color: #cbd5e0; }
.insert-row { display: flex; align-items: center; gap: 6px; background: #f0f4ff; border-radius: 6px; margin: 3px 0; padding: 6px 8px; border: 1px solid #c3dafe; }
.insert-row input { flex: 1; padding: 4px 8px; border: 1.5px solid #5a67d8; border-radius: 5px; font-size: 12px; font-family: inherit; outline: none; background: white; }
.ic.add-ic { color: #5a67d8; font-size: 15px; font-weight: 700; }
.ic.add-ic:hover { background: #e8eeff; }

.task-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; min-height: 30px; }
.task-cb { width: 15px; height: 15px; cursor: pointer; accent-color: #5a67d8; flex-shrink: 0; }
.task-lbl { font-size: 12px; color: #4a5568; flex: 1; line-height: 1.4; cursor: pointer; }
.task-lbl.done-lbl { text-decoration: line-through; color: #b2bec3; }
.task-edit-inp { flex: 1; padding: 3px 7px; border: 1.5px solid #5a67d8; border-radius: 5px; font-size: 12px; font-family: inherit; outline: none; }
.ic { background: none; border: none; cursor: pointer; padding: 3px 6px; font-size: 14px; border-radius: 4px; color: #a0aec0; transition: all .15s; }
.ic:hover { background: #f0f4f8; color: #4a5568; }
.ic.sv { color: #48bb78; font-weight: 700; font-size: 15px; }
.ic.cn { color: #e53e3e; }
.hint { font-size: 10px; color: #b0b8c8; text-align: center; padding: 2px 0 4px; background: #f8faff; border-radius: 4px; margin-bottom: 2px; }

.add-end-btn { display:flex; align-items:center; gap:5px; padding:6px 0; font-size:12px; color:#a0aec0; background:none; border:none; cursor:pointer; width:100%; }
.add-end-btn:hover { color:#5a67d8; }
.card-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
.btn-del-cl { padding: 5px 11px; background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; border-radius: 5px; font-size: 11px; cursor: pointer; }

.comp-section-hdr { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; cursor: pointer; user-select: none; }
.comp-section-hdr .csl { flex: 1; height: 1px; background: #e9d8fd; }
.comp-section-hdr .cslbl { font-size: 11px; font-weight: 700; color: #805ad5; background: #faf5ff; border: 1px solid #e9d8fd; padding: 3px 12px; border-radius: 20px; white-space: nowrap; }
.comp-section-hdr .csarr { font-size: 9px; color: #b794f4; transition: transform .2s; }
.comp-section-hdr .csarr.open { transform: rotate(180deg); }

.add-client-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 11px; background: white; border: 2px dashed #e2e8f0; border-radius: 10px; width: 100%; cursor: pointer; font-size: 12px; color: #a0aec0; margin-top: 6px; }
.add-client-btn:hover { border-color: #5a67d8; color: #5a67d8; background: #f0f4ff; }
.empty { text-align: center; padding: 36px 20px; color: #a0aec0; font-size: 13px; }

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
.overlay.open { display: flex; }
.modal { background: white; border-radius: 16px; padding: 26px; width: 100%; max-width: 360px; }
.modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #2d3748; }
.modal input { width: 100%; padding: 11px 13px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; margin-bottom: 14px; font-family: inherit; }
.modal input:focus { outline: none; border-color: #5a67d8; }
.modal-btns { display: flex; gap: 8px; }
.btn-cancel { flex: 1; padding: 11px; border: 1.5px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 14px; }
.btn-ok { flex: 2; padding: 11px; background: #5a67d8; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-card">
    <h1>🏢 사무실 업무 체크리스트</h1>
    <p>Supabase 연동 정보를 입력해 주세요.<br>한 번 입력하면 이 기기에서는 자동 저장됩니다.</p>
    <div class="form-group">
      <label>Project URL</label>
      <input type="url" id="sb-url" placeholder="https://xxxxx.supabase.co" />
    </div>
    <div class="form-group">
      <label>Anon Key (Legacy eyJ...)</label>
      <input type="text" id="sb-key" placeholder="eyJhbGci..." />
    </div>
    <button class="btn-connect" onclick="connectSupabase()">연결 완료 →</button>
    <p class="setup-hint">소득세 체크리스트와 동일한 URL · Key를 사용하시면 됩니다.</p>
  </div>
</div>

<div id="main-app">
  <div class="header">
    <div>
      <h1>🏢 업무 체크리스트</h1>
      <div class="date" id="today-date"></div>
    </div>
    <div class="sync-area">
      <div class="sync-dot ok" id="sync-dot"></div>
      <span class="sync-txt" id="sync-txt">연결됨</span>
      <button class="btn-reset" onclick="resetConn()">재설정</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content">
    <div class="summary-bar" id="summary-bar"></div>
    <div id="content"></div>
  </div>
</div>

<div class="overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modal-title">의뢰인 추가</h3>
    <input type="text" id="modal-input" placeholder="의뢰인 이름 또는 사건명"
      onkeydown="if(event.key==='Enter')addClient()" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-ok" onclick="addClient()">추가</button>
    </div>
  </div>
</div>

<script>
const CAT_DEFAULT={
  '양도소득세':['의뢰인 기본정보 수집','취득·양도 계약서 수집','취득가액 증빙 확인','필요경비 증빙 수집 (중개수수료·법무사비 등)','비과세·감면 요건 검토','장기보유특별공제 적용 확인','세액 계산 및 검토','신고서 작성','홈택스 신고','납부서 전달'],
  '증여세':   ['증여자·수증자 기본정보 수집','증여재산 종류 확인','증여재산 평가 (시가·보충평가)','10년 합산과세 검토','증여공제 적용 확인 (배우자·직계존비속 등)','세액 계산 및 검토','신고서 작성','홈택스 신고','납부서 전달'],
  '상속세':   ['피상속인·상속인 기본정보 수집','상속재산 목록 작성 (부동산·금융·기타)','부채·공과금 확인','사전증여재산 합산 검토','금융재산 조회','상속공제 적용 검토 (기초·배우자·일괄 등)','세액 계산 및 검토','신고서 작성','홈택스 신고','납부서 전달'],
  '세무조사': ['조사 안내문 수령·확인','조사 세목·기간 확인','의뢰인 사전 미팅 및 현황 파악','장부·증빙 정리','소명자료 준비','조사관 응대','조사 결과 검토','불복 절차 검토 (이의신청·심사청구)'],
  '기타':     ['우편물·공문 처리','수임 계약서 작성','세금계산서 발행','수수료 청구·수령 확인','업무일지 작성','기타 행정처리']
};
const CAT_KEYS=Object.keys(CAT_DEFAULT);
function mkTasks(cat){return CAT_DEFAULT[cat].map(t=>({text:t,done:false}));}

let SB_URL='',SB_KEY='';
let clients=[];
let activeTab=CAT_KEYS[0];
let openCards={};
let compOpen=true;
let editingTask=null;
let insertingAt=null;
let curModalCat='';

window.onload=function(){
  SB_URL=localStorage.getItem('oc2_url')||'';
  SB_KEY=localStorage.getItem('oc2_key')||'';
  if(SB_URL)document.getElementById('sb-url').value=SB_URL;
  if(SB_KEY)document.getElementById('sb-key').value=SB_KEY;
  if(SB_URL&&SB_KEY)showApp();
  const d=new Date();
  const el=document.getElementById('today-date');
  if(el)el.textContent=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
};

function connectSupabase(){
  const url=document.getElementById('sb-url').value.trim().replace(/\/$/,'');
  const key=document.getElementById('sb-key').value.trim();
  if(!url||!key){alert('URL과 Key를 모두 입력해 주세요.');return;}
  SB_URL=url;SB_KEY=key;
  localStorage.setItem('oc2_url',url);
  localStorage.setItem('oc2_key',key);
  showApp();
}
function showApp(){
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('main-app').style.display='block';
  renderTabs();loadData();
}
function resetConn(){
  if(!confirm('연동 설정을 초기화하시겠습니까?'))return;
  localStorage.removeItem('oc2_url');localStorage.removeItem('oc2_key');location.reload();
}

function setSync(state,txt){
  document.getElementById('sync-dot').className='sync-dot '+state;
  document.getElementById('sync-txt').textContent=txt;
}
async function apiGet(){
  setSync('loading','불러오는 중...');
  try{
    const r=await fetch(`${SB_URL}/rest/v1/office_checklist?select=*&order=created_at.asc`,
      {headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
    if(!r.ok)throw new Error(r.status);
    setSync('ok','동기화 완료');return await r.json();
  }catch(e){setSync('err','불러오기 실패');return null;}
}
async function apiInsert(rec){
  const r=await fetch(`${SB_URL}/rest/v1/office_checklist`,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify(rec)});
  if(!r.ok)throw new Error(await r.text());
  return(await r.json())[0];
}
async function apiPatch(id,fields){
  await fetch(`${SB_URL}/rest/v1/office_checklist?id=eq.${id}`,{
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'},
    body:JSON.stringify(fields)});
}
async function apiDelete(id){
  await fetch(`${SB_URL}/rest/v1/office_checklist?id=eq.${id}`,{
    method:'DELETE',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
}

function migrateTasks(tasks,category){
  if(Array.isArray(tasks))return tasks;
  const defs=CAT_DEFAULT[category]||[];
  const obj=tasks||{};
  return defs.map((text,i)=>({text:text,done:!!(obj[i]||obj[String(i)])}));
}
async function loadData(){
  const data=await apiGet();
  if(data){
    clients=data.map(cl=>{
      if(!Array.isArray(cl.tasks)){
        cl.tasks=migrateTasks(cl.tasks,cl.category);
        apiPatch(cl.id,{tasks:cl.tasks});
      }
      return cl;
    });
    renderAll();
  }
}
function getClients(cat){return clients.filter(c=>c.category===cat);}
function findCl(cid){return clients.find(c=>c.id===cid);}

function renderAll(){renderTabs();renderSummary();renderContent();}
function renderTabs(){
  document.getElementById('tabs').innerHTML=CAT_KEYS.map(cat=>
    `<div class="tab ${cat===activeTab?'active':''}" onclick="sw('${cat}')">${cat}</div>`).join('');
}
function sw(cat){activeTab=cat;editingTask=null;insertingAt=null;renderAll();}

function renderSummary(){
  const cls=getClients(activeTab);
  const active=cls.filter(c=>!c.completed);
  const comp=cls.filter(c=>c.completed);
  const taskDone=active.filter(c=>c.tasks&&c.tasks.length>0&&c.tasks.every(t=>t.done)).length;
  document.getElementById('summary-bar').innerHTML=`
    <div class="summary-item"><div class="num">${active.length}</div><div class="lbl">진행중</div></div>
    <div class="summary-item smid"><div class="num">${active.length-taskDone}</div><div class="lbl">처리중</div></div>
    <div class="summary-item sdone"><div class="num">${taskDone}</div><div class="lbl">완료대기</div></div>
    <div class="summary-item scomp"><div class="num">${comp.length}</div><div class="lbl">최종완료</div></div>`;
}

function renderContent(){
  const cls=getClients(activeTab);
  const active=cls.filter(c=>!c.completed);
  const comp=cls.filter(c=>c.completed);
  let html='';
  if(!active.length&&!comp.length)html=`<div class="empty"><div style="font-size:32px;margin-bottom:8px">📋</div>등록된 의뢰인이 없습니다.</div>`;
  active.forEach(cl=>{html+=buildCard(cl);});
  if(comp.length){
    html+=`<div class="comp-section-hdr" onclick="toggleCompSection()">
      <div class="csl"></div><div class="cslbl">✅ 최종완료 의뢰인 (${comp.length})</div>
      <div class="csl"></div><span class="csarr ${compOpen?'open':''}">▼</span></div>`;
    if(compOpen)comp.forEach(cl=>{html+=buildCard(cl);});
  }
  html+=`<button class="add-client-btn" onclick="openModal('${activeTab}')">＋ 의뢰인 추가</button>`;
  document.getElementById('content').innerHTML=html;
  if(editingTask){const el=document.getElementById(`ed-inp-${editingTask.cid}-${editingTask.idx}`);if(el){el.focus();el.select();}}
  if(insertingAt){const el=document.getElementById(`ins-inp-${insertingAt.cid}-${insertingAt.idx}`);if(el)el.focus();}
}

function buildCard(cl){
  // 구버전 데이터 형식 안전 처리
  if(!Array.isArray(cl.tasks)) cl.tasks=migrateTasks(cl.tasks,cl.category);
  const tasks=cl.tasks||[];
  const d=tasks.filter(t=>t.done).length;
  const tot=tasks.length;
  const pct=tot?Math.round(d/tot*100):0;
  const allDone=tot>0&&d===tot;
  const isComp=cl.completed;
  const isOpen=!!openCards[cl.id];
  const fillCls=isComp?'pf-comp':(allDone?'pf-done':'');
  const icon=isComp?'✅':(allDone?'🟢':'📂');
  let h=`<div class="client-card ${isComp?'comp-card':''}" id="card-${cl.id}">
    <div class="client-header" onclick="tog('${cl.id}')">
      <span style="font-size:15px">${icon}</span>
      <div class="client-name">${esc(cl.client_name)}</div>
      <input class="header-memo" placeholder="메모..." value="${esc(cl.memo||'')}"
        onclick="event.stopPropagation()"
        onblur="saveMemo('${cl.id}',this.value)" />
      <div class="progress-info">
        <div class="progress-text">${d}/${tot}</div>
        <div class="progress-bar"><div class="progress-fill ${fillCls}" style="width:${pct}%"></div></div>
      </div>
      <button class="btn-complete ${isComp?'is-done':''}" onclick="event.stopPropagation();toggleComplete('${cl.id}')">
        ${isComp?'↩ 되돌리기':'✅ 최종완료'}
      </button>
      <span class="chevron ${isOpen?'open':''}">▼</span>
    </div>
    <div class="client-body ${isOpen?'open':''}">
      <div class="body-divider"></div>`;
  tasks.forEach((task,i)=>{
    const isEd=editingTask&&editingTask.cid===cl.id&&editingTask.idx===i;
    const iIns=insertingAt&&insertingAt.cid===cl.id&&insertingAt.idx===i+1;
    if(isEd){
      h+=`<div class="task-item">
        <input type="checkbox" class="task-cb" ${task.done?'checked':''} disabled/>
        <input class="task-edit-inp" id="ed-inp-${cl.id}-${i}" value="${task.text.replace(/"/g,'&quot;')}"
          onkeydown="if(event.key==='Enter')saveEd('${cl.id}',${i});if(event.key==='Escape')cancelEd()"/>
        <button class="ic sv" onclick="saveEd('${cl.id}',${i})">✓</button>
        <button class="ic cn" onclick="cancelEd()">✕</button></div>`;
    } else {
      h+=`<div class="task-item">
        <input type="checkbox" class="task-cb" id="cb-${cl.id}-${i}" ${task.done?'checked':''}
          onchange="chkDone('${cl.id}',${i},this.checked)"/>
        <label class="task-lbl ${task.done?'done-lbl':''}" for="cb-${cl.id}-${i}">${task.text}</label>
        <button class="ic" onclick="startEd('${cl.id}',${i})" title="수정">✏️</button>
        <button class="ic del-ic" onclick="delTask('${cl.id}',${i})" title="삭제">🗑</button>
        <button class="ic add-ic" onclick="event.stopPropagation();startIns('${cl.id}',${i+1})" title="아래에 추가">＋</button>
      </div>`;
    }
    if(iIns){
      h+=`<div class="insert-row">
        <input id="ins-inp-${cl.id}-${i+1}" placeholder="새 항목 입력..."
          onkeydown="if(event.key==='Enter')saveIns('${cl.id}',${i+1});if(event.key==='Escape')cancelIns()"/>
        <button class="ic sv" onclick="saveIns('${cl.id}',${i+1})">✓</button>
        <button class="ic cn" onclick="cancelIns()">✕</button></div>`;
    }
  });
  // 맨 앞에 추가 (첫 항목 위)
  const iInsFirst=insertingAt&&insertingAt.cid===cl.id&&insertingAt.idx===0&&tasks.length>0;
  // 맨 끝에 추가 버튼
  const iInsEnd=insertingAt&&insertingAt.cid===cl.id&&insertingAt.idx===tasks.length&&(tasks.length===0||true);
  if(tasks.length===0||iInsEnd){
    h+=iInsEnd
      ?`<div class="insert-row">
          <input id="ins-inp-${cl.id}-${tasks.length}" placeholder="새 항목 입력..."
            onkeydown="if(event.key==='Enter')saveIns('${cl.id}',${tasks.length});if(event.key==='Escape')cancelIns()"/>
          <button class="ic sv" onclick="saveIns('${cl.id}',${tasks.length})">✓</button>
          <button class="ic cn" onclick="cancelIns()">✕</button></div>`
      :`<button class="add-end-btn" onclick="event.stopPropagation();startIns('${cl.id}',${tasks.length})">＋ 항목 추가</button>`;
  }
  h+=`<div class="card-actions"><button class="btn-del-cl" onclick="delClient('${cl.id}','${esc(cl.client_name)}')">🗑 삭제</button></div>
    </div></div>`;
  return h;
}

function tog(id){openCards[id]=!openCards[id];renderContent();}
function toggleCompSection(){compOpen=!compOpen;renderContent();}

async function chkDone(cid,idx,val){
  const cl=findCl(cid);if(!cl)return;
  cl.tasks[idx].done=val;openCards[cid]=true;
  renderSummary();renderContent();
  await apiPatch(cid,{tasks:cl.tasks});setSync('ok','저장됨');
}
function startEd(cid,idx){editingTask={cid,idx};insertingAt=null;openCards[cid]=true;renderContent();}
function cancelEd(){editingTask=null;renderContent();}
async function saveEd(cid,idx){
  const el=document.getElementById(`ed-inp-${cid}-${idx}`);if(!el)return;
  const v=el.value.trim();if(!v){el.focus();return;}
  const cl=findCl(cid);if(!cl)return;
  cl.tasks[idx].text=v;editingTask=null;renderContent();
  await apiPatch(cid,{tasks:cl.tasks});setSync('ok','저장됨');
}
async function delTask(cid,idx){
  const cl=findCl(cid);if(!cl)return;
  cl.tasks.splice(idx,1);openCards[cid]=true;renderSummary();renderContent();
  await apiPatch(cid,{tasks:cl.tasks});setSync('ok','저장됨');
}
function startIns(cid,idx){insertingAt={cid,idx};editingTask=null;openCards[cid]=true;renderContent();}
function cancelIns(){insertingAt=null;renderContent();}
async function saveIns(cid,idx){
  const el=document.getElementById(`ins-inp-${cid}-${idx}`);if(!el)return;
  const v=el.value.trim();if(!v){el.focus();return;}
  const cl=findCl(cid);if(!cl)return;
  cl.tasks.splice(idx,0,{text:v,done:false});
  insertingAt=null;openCards[cid]=true;renderSummary();renderContent();
  await apiPatch(cid,{tasks:cl.tasks});setSync('ok','저장됨');
}
async function saveMemo(cid,val){
  const cl=findCl(cid);if(!cl)return;
  cl.memo=val;await apiPatch(cid,{memo:val});setSync('ok','저장됨');
}
async function toggleComplete(cid){
  const cl=findCl(cid);if(!cl)return;
  if(!cl.completed){
    if(!confirm(`'${cl.client_name}' 의뢰인을 최종완료 처리하시겠습니까?`))return;
    cl.completed=true;openCards[cid]=false;compOpen=true;
  }else{cl.completed=false;openCards[cid]=false;}
  renderAll();await apiPatch(cid,{completed:cl.completed});setSync('ok','저장됨');
}
async function delClient(cid,name){
  if(!confirm(`'${name}' 의뢰인을 삭제하시겠습니까?`))return;
  await apiDelete(cid);clients=clients.filter(c=>c.id!==cid);renderAll();setSync('ok','삭제됨');
}
function openModal(cat){
  curModalCat=cat;
  document.getElementById('modal-title').textContent=`${cat} 의뢰인 추가`;
  document.getElementById('modal-input').value='';
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('modal-input').focus(),80);
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
async function addClient(){
  const name=document.getElementById('modal-input').value.trim();
  if(!name){alert('이름을 입력해 주세요.');return;}
  closeModal();
  try{
    const rec=await apiInsert({category:curModalCat,client_name:name,tasks:mkTasks(curModalCat),memo:''});
    clients.push(rec);openCards[rec.id]=true;renderAll();setSync('ok','저장됨');
  }catch(e){setSync('err','저장 실패');alert('저장 실패: '+e.message);}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
</script>
</body>
</html>
